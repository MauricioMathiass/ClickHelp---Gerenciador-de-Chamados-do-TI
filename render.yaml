# Publicação do backend no Render (Blueprint: New → Blueprint → este repositório).
# Os valores marcados com "sync: false" são pedidos pelo Render na criação e
# nunca ficam no repositório.
services:
  - type: web
    name: clickhelp-api
    runtime: node
    plan: free
    # Crie o projeto no Neon na região AWS US East 1 (N. Virginia), a mesma
    # desta API, para cada consulta ao banco não atravessar continentes.
    region: virginia
    # Publica a cada push na main, mas só depois de o GitHub Actions (CI) passar.
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Sao_Paulo
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_DEPARTMENT
        value: TI
      # Endereço do site no Netlify (ex.: https://clickhelp.netlify.app)
      - key: FRONTEND_ORIGIN
        sync: false
      # EmailJS (opcional): aviso por e-mail de novos chamados. Deixe em branco
      # para não enviar. Ver backend/.env.example.
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_TO
        sync: false
